# CodeQL as an advanced setup, because default setup can't be told where the code is: the TypeScript lives under
# .claude/mods, a dot-folder the JavaScript extractor skips, so default setup found nothing to read and stopped scanning.
# The config names both folders this repo has code in.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 9 * * 1"   # weekly, so new queries reach code that hasn't changed

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: actions, javascript-typescript
          build-mode: none
          config: |
            paths:
              - .claude/mods
              - .github/workflows
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
